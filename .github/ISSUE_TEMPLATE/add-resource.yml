name: Add resource
description: Add a link to the library. A screenshot is taken automatically.
title: "[Resource] "
body:
  - type: input
    id: url
    attributes:
      label: Link
      description: The full web address, starting with https://
      placeholder: https://example.com
    validations:
      required: true
  - type: dropdown
    id: tags
    attributes:
      label: Tags
      description: Pick Designers, Libraries, Writings, The Context Room first, then any other tags that fit.
      multiple: true
            options:
        - Designers
        - Libraries
        - The Reading Room
        - The Context Room
        - Portfolios
        - Talks
        - Thoughts
        - Podcast
        - UI
        - AI
        - Motion
        - Icons
        - UX
        - Product
        - Process
        - AI Process
        - AI Prompts
        - AI Components
        - Voice
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title (optional)
      description: Leave empty to use the page's own title.
      placeholder: Designer's name
    validations:
      required: false
