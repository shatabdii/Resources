name: Add resource
description: Add a link to the library. A screenshot is taken automatically.
title: "[Resource] "
body:
  - type: input
    id: url
    attributes:
      label: Link
      description: The full web address, starting with https://
      placeholder: https://example.com
    validations:
      required: true
  - type: dropdown
    id: tags
    attributes:
      label: Tags
      description: Pick one or more. The first one you pick sets the tag in Figma.
      multiple: true
      options:
        - UI Resources
        - Portfolios
        - Writing
        - Design Talks
        - UI
        - Motion
        - UX
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title (optional)
      description: Leave empty to use the page's own title.
      placeholder: Designer's name
    validations:
      required: false
