name: Add resource
description: Add a link to the library. A screenshot is taken automatically.
title: "[Resource] "
body:
  - type: input
    id: url
    attributes:
      label: Link
      description: The full web address, starting with https://
      placeholder: https://example.com
    validations:
      required: true
  - type: dropdown
    id: tag
    attributes:
      label: Tag
      options:
        - UI Resources
        - Portfolios
        - Writing
        - Design Talks
    validations:
      required: true
   - type: dropdown
    id: subtag
    attributes:
      label: Sub-tag (optional)
      description: Only for UI Resources. Leave empty for other tags.
      options:
        - CSS Components
        - Motion Components
    validations:
      required: false
  - type: input
    id: title
    attributes:
      label: Title (optional)
      description: Leave empty to use the page's own title.
      placeholder: Florian Kiem
    validations:
      required: false
