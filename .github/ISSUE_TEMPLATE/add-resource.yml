name: Add resource
description: Add a link to the library. A screenshot is taken automatically.
title: "[Resource] "
body:
  - type: input
    id: url
    attributes:
      label: Link
      description: The full web address, starting with https://
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Tag
      description: One word that groups this resource.
      placeholder: Designer
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title (optional)
      description: Leave empty to use the page's own title.
      placeholder: Florian Kiem
    validations:
      required: false
