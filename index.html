<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resources</title>
  <meta name="description" content="A curated library of design resources.">
  <style>
    @font-face { font-family: 'Aspekta'; font-weight: 400; font-display: swap; src: url('fonts/Aspekta-400.woff2') format('woff2'); }
    @font-face { font-family: 'Aspekta'; font-weight: 600; font-display: swap; src: url('fonts/Aspekta-600.woff2') format('woff2'); }
    @font-face { font-family: 'Aspekta'; font-weight: 650; font-display: swap; src: url('fonts/Aspekta-650.woff2') format('woff2'); }
    @font-face { font-family: 'Aspekta'; font-weight: 700; font-display: swap; src: url('fonts/Aspekta-700.woff2') format('woff2'); }

    :root {
      --bg: #ffffff;
      --card: #f6f6f6;
      --title: #444444;
      --text: #373332;
      --muted: #777777;
      --chip: #e8e7e7;
      --nav-active: #e9e9e9;
      --line: #e5e5e5;
      --sidebar: 284px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Aspekta', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Layout: sidebar + grid ---------- */
    .layout { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }

    /* ---------- Sidebar ---------- */
    aside {
      position: sticky; top: 0; height: 100vh;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 32px 16px 16px 32px;
      background: var(--bg);
    }
    .side-top { display: flex; flex-direction: column; gap: 16px; }
    h1 {
      font-size: 32px; font-weight: 650; line-height: 1.2; letter-spacing: -0.16px;
      color: var(--title); margin: 0;
    }
    nav { display: flex; flex-direction: column; }
    nav button {
      display: flex; align-items: center; height: 32px; width: 100%;
      padding: 0 4px 0 12px; border: 0; border-radius: 4px;
      background: transparent; cursor: pointer; text-align: left;
      font: inherit; font-size: 12px; font-weight: 400; line-height: 1.18; letter-spacing: 0.24px;
      color: var(--muted);
    }
    nav button:hover { color: var(--text); }
    nav button[aria-pressed="true"] { background: var(--nav-active); color: var(--text); font-weight: 600; }
    nav button.sub { padding-left: 28px; }

    /* Add Resource button + panel */
    .add-btn {
      width: 100%; height: 32px; border: 1px solid rgba(208,208,208,0.1); border-radius: 4px;
      background: linear-gradient(90deg, #2d2d2d, #525252); color: #fff; cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 700; line-height: 1.18; letter-spacing: 0.24px;
    }
    .add-btn:hover { background: linear-gradient(90deg, #1f1f1f, #444444); }
    .add-panel { display: none; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .add-panel.open { display: flex; }
    .add-panel input, .add-panel select {
      width: 100%; height: 32px; padding: 0 10px;
      font: inherit; font-size: 12px; letter-spacing: 0.24px; color: var(--text);
      background: #fff; border: 1px solid var(--chip); border-radius: 4px;
    }
    .add-panel .note { font-size: 11px; line-height: 1.4; color: var(--muted); margin: 0; }

    /* ---------- Cards ---------- */
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 8px;
      align-content: start;
    }
    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 48px 16px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 80px;
      text-decoration: none; color: inherit;
      transition: background 0.15s ease;
    }
    .card:hover { background: #efefef; }
    .card img {
      width: 53.5%; aspect-ratio: 243 / 171;
      object-fit: cover; object-position: top;
      border-radius: 6px; background: #fff; display: block;
      box-shadow: 0 6px 9px 4.5px rgba(177,177,177,0.15), 0 3px 3px 0 rgba(200,200,200,0.3);
      transition: transform 0.2s ease;
    }
    .card:hover img { transform: translateY(-3px); }
    .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100%; min-width: 0; }
    .title {
      font-size: 16px; font-weight: 600; line-height: 1.2; color: var(--title);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
      padding-top: 3px;
    }
    .tag {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--chip); color: var(--text);
      border: 1px solid rgba(208,208,208,0.1);
      font-size: 12px; font-weight: 400; line-height: 1.18; letter-spacing: 0.24px;
      padding: 4px; border-radius: 4px; white-space: nowrap;
    }
    .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 120px 0; font-size: 14px; }

    /* ---------- Small screens: sidebar on top ---------- */
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; padding: 24px 16px; gap: 16px; }
      nav { flex-direction: row; flex-wrap: wrap; gap: 4px; }
      nav button { width: auto; padding: 0 12px; }
      main { grid-template-columns: 1fr; padding: 0 8px 8px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="side-top">
        <h1>Resources</h1>
        <nav id="filters" aria-label="Filter by tag"></nav>
      </div>
      <div>
        <form class="add-panel" id="add-panel">
          <input id="s-url" type="url" placeholder="https://" required aria-label="Link">
          <select id="s-tag" aria-label="Tag"></select>
          <select id="s-sub" aria-label="Sub-tag" hidden></select>
          <p class="note">Opens GitHub with your suggestion filled in. It appears here once approved.</p>
        </form>
        <button class="add-btn" id="add-btn" type="button">Add Resource</button>
      </div>
    </aside>
    <main id="grid"></main>
  </div>

  <script>
    const REPO = 'https://github.com/shatabdii/Resources';

    // Tags, in the order they appear in the sidebar. Matches the Tag component in Figma.
    const TAGS = [
      { name: 'Portfolios',   emoji: '🖥️', aliases: ['designer'] },
      { name: 'UI Resources', emoji: '🌐', subtags: ['CSS Components', 'Motion Components'] },
      { name: 'Design Talks', emoji: '💡' },
      { name: 'Writing',      emoji: '✍🏼' },
    ];

    const grid = document.getElementById('grid');
    const filters = document.getElementById('filters');
    let all = [];
    let active = { tag: 'All', sub: '' };

    function tagInfo(tag) {
      const name = String(tag || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
      const key = name.toLowerCase();
      const known = TAGS.find(t => t.name.toLowerCase() === key || (t.aliases || []).includes(key));
      return { name: known ? known.name : name, label: known ? known.emoji + ' ' + known.name : name };
    }

    function safeUrl(u) {
      try { const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : '#'; }
      catch { return '#'; }
    }

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    // Sidebar: "All Resources", each tag in use, and its sub-tags in use (indented)
    function navButton(label, tag, sub, isSub) {
      const b = el('button', isSub ? 'sub' : '', label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(active.tag === tag && active.sub === sub));
      b.onclick = () => { active = { tag, sub }; renderFilters(); renderGrid(); };
      return b;
    }

    function renderFilters() {
      const used = new Set(all.map(r => tagInfo(r.tag).name));
      const names = [...TAGS.map(t => t.name).filter(n => used.has(n)), ...[...used].filter(n => !TAGS.some(t => t.name === n))];
      const buttons = [navButton('All Resources', 'All', '', false)];
      for (const n of names) {
        buttons.push(navButton(n, n, '', false));
        const known = TAGS.find(t => t.name === n);
        const usedSubs = new Set(all.filter(r => tagInfo(r.tag).name === n && r.subtag).map(r => r.subtag));
        const subs = [...((known && known.subtags) || []).filter(x => usedSubs.has(x)), ...[...usedSubs].filter(x => !(known && (known.subtags || []).includes(x)))];
        for (const sub of subs) buttons.push(navButton(sub, n, sub, true));
      }
      filters.replaceChildren(...buttons);
    }

    function renderGrid() {
      const list = all.filter(r =>
        active.tag === 'All' ||
        (tagInfo(r.tag).name === active.tag && (!active.sub || r.subtag === active.sub)));
      if (!list.length) { grid.replaceChildren(el('p', 'empty', 'No resources yet.')); return; }
      grid.replaceChildren(...list.map(r => {
        const a = el('a', 'card');
        a.href = safeUrl(r.url);
        a.target = '_blank';
        a.rel = 'noopener';
        const img = el('img');
        img.src = r.image; img.alt = r.title; img.loading = 'lazy';
        const row = el('div', 'row');
        const info = tagInfo(r.tag);
        const chip = r.subtag ? info.label.split(' ')[0] + ' ' + r.subtag : info.label;
        row.append(el('span', 'title', r.title), el('span', 'tag', chip));
        a.append(img, row);
        return a;
      }));
    }

    // Add Resource: first click opens the panel, second click sends to GitHub
    const panel = document.getElementById('add-panel');
    const addBtn = document.getElementById('add-btn');
    const urlInput = document.getElementById('s-url');
    const tagSelect = document.getElementById('s-tag');
    const subSelect = document.getElementById('s-sub');
    tagSelect.replaceChildren(...TAGS.map(t => el('option', '', t.name)));
    function updateSubSelect() {
      const t = TAGS.find(x => x.name === tagSelect.value);
      const subs = (t && t.subtags) || [];
      subSelect.replaceChildren(el('option', '', 'None'), ...subs.map(x => el('option', '', x)));
      subSelect.hidden = subs.length === 0;
    }
    tagSelect.onchange = updateSubSelect;
    updateSubSelect();

    function submitSuggestion() {
      if (!urlInput.reportValidity()) return;
      const link = urlInput.value.trim();
      let host = link;
      try { host = new URL(link).hostname.replace(/^www\./, ''); } catch {}
      const q = new URLSearchParams({
        template: 'add-resource.yml',
        title: '[Resource] ' + host,
        url: link,
        tag: tagSelect.value,
      });
      if (!subSelect.hidden && subSelect.value !== 'None') q.set('subtag', subSelect.value);
      window.open(REPO + '/issues/new?' + q.toString(), '_blank', 'noopener');
      urlInput.value = '';
      panel.classList.remove('open');
      addBtn.textContent = 'Add Resource';
    }

    addBtn.onclick = () => {
      if (!panel.classList.contains('open')) {
        panel.classList.add('open');
        addBtn.textContent = 'Open on GitHub';
        urlInput.focus();
      } else {
        submitSuggestion();
      }
    };
    panel.onsubmit = (e) => { e.preventDefault(); submitSuggestion(); };

    fetch('resources.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => { all = data; renderFilters(); renderGrid(); })
      .catch(() => { grid.replaceChildren(el('p', 'empty', 'Could not load resources.')); });
  </script>
</body>
</html>
